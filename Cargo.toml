[package]
name = "sekeeper"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Password manager GTK4 con vault cifrato"
license = "MIT"

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["zeroize"] }
gtk4 = { version = "0.9", features = ["v4_6"] }
libc = "0.2"
rand = "0.8"
quick-xml = { version = "0.41", features = ["serialize"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Exercise the real, deliberately expensive KDF in tests without interpreting its
# hot loops in debug builds. Parameters remain identical to the release build.
[profile.dev.package.argon2]
opt-level = 3
